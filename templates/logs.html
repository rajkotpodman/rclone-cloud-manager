<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rclone Cloud Manager | Activity Logs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0d14;
      --bg-card: rgba(18, 24, 38, 0.7);
      --border-card: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(56, 189, 248, 0.4);
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --glow-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 10% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 85%, rgba(129, 140, 248, 0.08) 0%, transparent 45%);
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-card);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border-card);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--border-focus);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(12px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .file-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .terminal-box {
      background: #080b12;
      border: 1px solid var(--border-card);
      border-radius: 10px;
      padding: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #94a3b8;
      max-height: 600px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.6;
    }
    .log-line-error { color: #f43f5e; }
    .log-line-info { color: #38bdf8; }
    .log-line-success { color: #34d399; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">
        <h1 class="brand-title"><span>📜</span> System Activity Logs</h1>
      </div>
      <div>
        <a href="/?api_key={{ api_key }}" class="btn">⬅️ Back to Dashboard</a>
        <a href="/logs?api_key={{ api_key }}" class="btn" style="background: var(--glow-gradient); color: #0a0d14; border: none; font-weight: 700;">🔄 Refresh Logs</a>
      </div>
    </header>

    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Last 50 Lines Recorded</h2>
        <span class="file-tag">{{ log_file_name }}</span>
      </div>
      <div class="terminal-box">{{ log_content }}</div>
    </div>
  </div>

</body>
</html>
